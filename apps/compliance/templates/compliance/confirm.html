{% extends 'compliance/base.html' %}{% block content %}
<h1>Confirm account deletion</h1><p>This permanently removes your AnonymoKe account and associated data. You can close this page to keep your account.</p>
<form method="post" action="{% url 'public-deletion-confirm' %}" class="panel" id="confirm-form">{% csrf_token %}<input type="hidden" name="token" id="deletion-token"><label class="check"><input type="checkbox" name="confirm" value="yes" required><span>I understand that my account and its data will be permanently deleted, with retained records described in the privacy policy.</span></label><button class="danger" id="delete-button" disabled>Confirm permanent deletion</button><p><a href="{% url 'privacy-policy' %}">Read the privacy policy</a></p><p class="muted" id="link-status" role="status">Checking your confirmation link…</p></form>
<noscript><p>Enable JavaScript to use this secure confirmation link, or request deletion from Profile in the app.</p></noscript>
<script nonce="{{ nonce }}">(()=>{'use strict';const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);if(/^[A-Za-z0-9_-]{43}$/.test(token)){document.getElementById('deletion-token').value=token;document.getElementById('delete-button').disabled=false;document.getElementById('link-status').textContent='Nothing is deleted until you confirm above.';}else{document.getElementById('link-status').textContent='This link is incomplete. Request a new confirmation email.';}})();</script>
{% endblock %}

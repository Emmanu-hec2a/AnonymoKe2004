<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · AnonymoKe</title>
<style nonce="{{ nonce }}">
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--text:#f2f4f8;--muted:#b4bbc8;--violet:#6a4af0;--teal:#2ec4b6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:820px;margin:0 auto;padding:28px 24px 48px}header{display:flex;align-items:center;gap:14px;margin-bottom:38px;font-size:22px;font-weight:750}header img{width:64px;height:48px;object-fit:contain}h1{font-size:clamp(27px,5vw,38px);line-height:1.2;margin:0 0 20px}h2{font-size:21px;margin-top:32px}p{margin:12px 0}a{color:#9d86ff;text-underline-offset:3px}label{display:block;font-weight:600;margin:18px 0 8px}input[type=email]{width:100%;padding:15px;background:#1e222c;color:var(--text);border:1px solid #3a3f52;border-radius:12px;font:inherit}input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #9d86ff;outline-offset:3px}button{display:block;width:100%;margin:22px 0 12px;background:var(--violet);color:white;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.panel{padding:24px;background:var(--card);border:1px solid #262b38;border-radius:18px;margin:22px 0}.muted,footer{color:var(--muted)}.error{color:#ff8f96}.success{color:var(--teal)}.check{display:flex;gap:12px;align-items:flex-start;font-weight:400}.check input{margin-top:6px;min-width:20px;min-height:20px;accent-color:var(--violet)}.document p{white-space:pre-wrap;overflow-wrap:anywhere}footer{border-top:1px solid #262b38;margin-top:40px;padding-top:22px;font-size:14px}footer nav{display:flex;flex-wrap:wrap;gap:18px}.danger{background:#e5484d}li{margin:8px 0}
</style></head><body><main><header><img src="{% url 'legal-logo' %}" alt="AnonymoKe AK logo"><span>AnonymoKe</span></header>
{% block content %}{% endblock %}
<footer><nav><a href="{% url 'privacy-policy' %}">Privacy policy</a><a href="{% url 'public-terms' %}">Terms of use</a><a href="{% url 'public-account-deletion' %}">Delete account</a></nav><p>AnonymoKe · Nairobi, Kenya</p></footer></main></body></html>

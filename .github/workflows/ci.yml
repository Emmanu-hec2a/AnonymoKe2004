name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: anonymoke
          POSTGRES_PASSWORD: anonymoke-test-only
          POSTGRES_DB: anonymoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anonymoke"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgis://anonymoke:anonymoke-test-only@localhost:5432/anonymoke
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIS runtime
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev ffmpeg
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run


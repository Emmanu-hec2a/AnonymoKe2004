[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymoke-backend"
version = "0.1.0"
description = "Privacy-first location-based discovery and matching backend for AnonymoKE."
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.0,<6.0",
  "djangorestframework>=3.15,<4.0",
  "django-environ>=0.11,<1.0",
  "drf-spectacular>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=6.1,<7.0",
  "celery[redis]>=5.4,<6.0",
  "channels>=4.1,<5.0",
  "channels-redis>=4.2,<5.0",
  "daphne>=4.1,<5.0",
  "boto3>=1.35,<2.0",
  "PyJWT>=2.9,<3.0",
  "cryptography>=43.0,<44.0",
  "Pillow>=11.0,<12.0",
  "opencv-python-headless>=4.10,<5.0",
  "firebase-admin>=6.6,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "pytest-cov>=5.0,<6.0",
  "factory-boy>=3.3,<4.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "django-stubs[compatible-mypy]>=5.1,<6.0",
  "pre-commit>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.setuptools.package-data]
"apps.accounts" = ["resources/*.jpeg", "templates/accounts/emails/*.html", "templates/accounts/emails/*.txt", "templates/accounts/auth/*.html"]
"apps.profiles" = ["resources/*.xml"]
"apps.compliance" = ["resources/*.txt", "templates/compliance/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --cov=apps --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["apps"]

